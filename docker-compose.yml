services:
  postgres:
    container_name: kezek-postgres
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - 127.0.0.1:${POSTGRES_PORT}:5432
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  pgdata: